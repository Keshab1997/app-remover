name: goodbye_apps
description: "Goodbye Apps – a Flutter Android app for browsing, inspecting and uninstalling installed apps."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Let the toolchain build lib/l10n/generated from the .arb files (docs/10).
  generate: true
  uses-material-design: true
